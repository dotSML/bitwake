name: Performance

on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Calibrated Chromium timing and memory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run calibrated browser benchmark
        env:
          NEOTORRENT_PERF_ITERATIONS: '3'
        run: pnpm test:performance
      - name: Upload measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neotorrent-performance-${{ github.sha }}
          path: |
            test-results/performance/metrics.json
            test-results/performance/playwright
            playwright-report/performance
          if-no-files-found: warn
