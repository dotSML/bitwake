name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check canonical product identity
        run: pnpm identity:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test:all
      - name: Review production dependency licenses
        run: pnpm run licenses
      - name: Build qBittorrent package
        run: pnpm build:alt-webui
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser tests
        run: pnpm test:e2e
      - name: Production PWA cache-boundary tests
        run: pnpm test:pwa
