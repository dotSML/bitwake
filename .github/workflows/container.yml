name: Container

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

env:
  REGISTRY: ghcr.io
  CANONICAL_IMAGE_NAME: dotsml/bitwake
  LEGACY_IMAGE_NAME: dotsml/neotorrent

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  # Keep branch/PR feedback current, but serialize tag runs so a queued rerun
  # cannot race the immutable-tag existence check and registry push.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Source, browser, image, and qBittorrent gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Enable locked pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0+sha512.486ebc259d3e999a4e8691ce03b5cac4a71cbeca39372a9b762cb500cfdf0873e2cb16abe3d951b1ee2cf012503f027b98b6584e4df22524e0c7450d9ec7aa7b --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tagged release source and license
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm release:verify -- --tag "$GITHUB_REF_NAME" --require-git-tag --require-license
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test:all
      - name: Review production dependency licenses
        run: pnpm run licenses
      - name: Build native Alternative WebUI package
        run: pnpm build:alt-webui
      - name: Build standalone frontend
        run: pnpm build:standalone
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser tests
        run: pnpm test:e2e
      - name: Production PWA cache-boundary tests
        run: pnpm test:pwa
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Derive deterministic image metadata
        id: build
        shell: bash
        run: |
          created=$(git show -s --format=%cI "$GITHUB_SHA")
          license=$(node -e 'const value=require("./package.json").license; process.stdout.write(!value || value === "UNLICENSED" || value === "NOASSERTION" ? "NOASSERTION" : value)')
          {
            echo "created=${created}"
            echo "revision=${GITHUB_SHA}"
            echo "version=ci-${GITHUB_SHA:0:12}"
            echo "license=${license}"
          } >> "$GITHUB_OUTPUT"
      - name: Build local linux/amd64 test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bitwake:ci-amd64
          build-args: |
            BUILD_CREATED=${{ steps.build.outputs.created }}
            BUILD_REVISION=${{ steps.build.outputs.revision }}
            BUILD_VERSION=${{ steps.build.outputs.version }}
            BUILD_LICENSE=${{ steps.build.outputs.license }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deterministic proxy and real qBittorrent 5.2.3 tests
        env:
          BITWAKE_IMAGE: bitwake:ci-amd64
        run: pnpm container:test
      - name: Verify local image identity labels
        shell: bash
        run: |
          for label in title description source url documentation created revision version licenses; do
            expected=$(
              case "$label" in
                title) echo 'Bitwake' ;;
                description) echo 'Bitwake standalone qBittorrent WebUI reverse proxy' ;;
                source|url) echo 'https://github.com/dotSML/bitwake' ;;
                documentation) echo 'https://github.com/dotSML/bitwake/blob/main/docs/deployment.md' ;;
                created) echo '${{ steps.build.outputs.created }}' ;;
                revision) echo '${{ steps.build.outputs.revision }}' ;;
                version) echo '${{ steps.build.outputs.version }}' ;;
                licenses) echo '${{ steps.build.outputs.license }}' ;;
              esac
            )
            actual=$(docker image inspect bitwake:ci-amd64 --format "{{ index .Config.Labels \"org.opencontainers.image.${label}\" }}")
            if [[ "$actual" != "$expected" ]]; then
              echo "Image label $label: expected $expected, received $actual" >&2
              exit 1
            fi
          done
      - name: Scan linux/amd64 HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bitwake:ci-amd64
          version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Build local linux/arm64 scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: bitwake:ci-arm64
          build-args: |
            BUILD_CREATED=${{ steps.build.outputs.created }}
            BUILD_REVISION=${{ steps.build.outputs.revision }}
            BUILD_VERSION=${{ steps.build.outputs.version }}
            BUILD_LICENSE=${{ steps.build.outputs.license }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan linux/arm64 HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bitwake:ci-arm64
          version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  publish:
    name: Publish dual-name provenance and multi-architecture image
    needs: verify
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive deterministic image metadata
        id: build
        shell: bash
        run: |
          created=$(git show -s --format=%cI "$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            release=true
            if [[ "$version" == *-* ]]; then stable=false; else stable=true; fi
          else
            version="ci-${GITHUB_SHA:0:12}"
            release=false
            stable=false
          fi
          license=$(node -e 'const value=require("./package.json").license; process.stdout.write(!value || value === "UNLICENSED" || value === "NOASSERTION" ? "NOASSERTION" : value)')
          {
            echo "created=${created}"
            echo "revision=${GITHUB_SHA}"
            echo "version=${version}"
            echo "license=${license}"
            echo "release=${release}"
            echo "stable=${stable}"
          } >> "$GITHUB_OUTPUT"
      - name: Reject existing immutable image tags in both packages
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            immutable_tags=("$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}")
          else
            immutable_tags=("sha-${GITHUB_SHA}")
          fi
          for configured_image in "$CANONICAL_IMAGE_NAME" "$LEGACY_IMAGE_NAME"; do
            image_name=${configured_image,,}
            token=$(
              curl --fail --silent --show-error \
                --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
                "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${image_name}:pull" \
                | jq --exit-status --raw-output '.token // .access_token'
            )
            for image_tag in "${immutable_tags[@]}"; do
              status=$(
                curl --silent --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --header "Authorization: Bearer ${token}" \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "https://${REGISTRY}/v2/${image_name}/manifests/${image_tag}"
              )
              case "$status" in
                200)
                  echo "Immutable image tag ${REGISTRY}/${image_name}:${image_tag} already exists; refusing to replace it." >&2
                  exit 1
                  ;;
                404)
                  echo "Image tag ${REGISTRY}/${image_name}:${image_tag} is available."
                  ;;
                *)
                  echo "Could not safely determine whether ${REGISTRY}/${image_name}:${image_tag} exists (HTTP ${status}); refusing to publish." >&2
                  exit 1
                  ;;
              esac
            done
          done
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.CANONICAL_IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ steps.build.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ steps.build.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ steps.build.outputs.stable == 'true' }}
      - name: Build and publish linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_CREATED=${{ steps.build.outputs.created }}
            BUILD_REVISION=${{ steps.build.outputs.revision }}
            BUILD_VERSION=${{ steps.build.outputs.version }}
            BUILD_LICENSE=${{ steps.build.outputs.license }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Verify both published manifests
        id: manifests
        shell: bash
        run: |
          if [[ '${{ steps.build.outputs.release }}' == true ]]; then
            version=${GITHUB_REF_NAME#v}
            verification_tags=("$GITHUB_REF_NAME" "$version")
            if [[ '${{ steps.build.outputs.stable }}' == true ]]; then
              verification_tags+=("${version%.*}")
            fi
          else
            verification_tags=(edge "sha-${GITHUB_SHA}")
          fi
          for identity in canonical legacy; do
            if [[ "$identity" == canonical ]]; then
              image_name=$CANONICAL_IMAGE_NAME
            else
              image_name=$LEGACY_IMAGE_NAME
            fi
            published_digest=
            for image_tag in "${verification_tags[@]}"; do
              tag_reference="${REGISTRY}/${image_name}:${image_tag}"
              manifest=$(docker buildx imagetools inspect "$tag_reference" --format '{{json .Manifest}}')
              digest=$(node -e 'const value=JSON.parse(process.argv[1]); const digest=value.digest; if (!/^sha256:[0-9a-f]{64}$/.test(digest ?? "")) process.exit(1); process.stdout.write(digest)' "$manifest")
              if [[ -n "$published_digest" && "$digest" != "$published_digest" ]]; then
                echo "Published aliases for ${REGISTRY}/${image_name} resolve to different manifests." >&2
                exit 1
              fi
              published_digest=$digest
              immutable_reference="${REGISTRY}/${image_name}@${digest}"
              docker buildx imagetools inspect "$immutable_reference"
              for platform in linux/amd64 linux/arm64; do
                image=$(docker buildx imagetools inspect "$immutable_reference" --format "{{json (index .Image \"$platform\")}}")
                node -e '
                  const value = JSON.parse(process.argv[1])
                  const labels = value.config?.Labels ?? {}
                  if (labels["org.opencontainers.image.title"] !== "Bitwake" || labels["org.opencontainers.image.revision"] !== process.argv[2] || labels["org.opencontainers.image.version"] !== process.argv[3]) process.exit(1)
                ' "$image" '${{ steps.build.outputs.revision }}' '${{ steps.build.outputs.version }}'
              done
            done
            echo "${identity}_digest=${published_digest}" >> "$GITHUB_OUTPUT"
            echo "${identity}_reference=${immutable_reference}" >> "$GITHUB_OUTPUT"
          done
      - name: Attest canonical Bitwake image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CANONICAL_IMAGE_NAME }}
          subject-digest: ${{ steps.manifests.outputs.canonical_digest }}
          push-to-registry: true
      - name: Attest deprecated compatibility image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          subject-digest: ${{ steps.manifests.outputs.legacy_digest }}
          push-to-registry: true
      - name: Report immutable references
        run: |
          {
            echo "### Published Bitwake image"
            echo '```text'
            echo '${{ steps.manifests.outputs.canonical_reference }}'
            echo '```'
            echo
            echo 'Deprecated compatibility publication:'
            echo '```text'
            echo '${{ steps.manifests.outputs.legacy_reference }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
