version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Routine updates share CI coverage; majors remain isolated migrations.
      frontend-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # typescript-eslint 8.x does not support TypeScript 7, so do not open a
    # known-incompatible compiler update until the lint stack supports it.
    ignore:
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
      # Tailwind CSS 4 requires a dedicated PostCSS and stylesheet migration;
      # keep receiving supported Tailwind 3 updates until that work is ready.
      - dependency-name: tailwindcss
        versions:
          - '>=4.0.0'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
