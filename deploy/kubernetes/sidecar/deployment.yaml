# Migration template: copy the neotorrent container and neotorrent-tmp volume
# into the existing torrent Deployment. Keep the existing qBittorrent container,
# volumes, VPN sidecars, ports, environment, resources, and security settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent
  namespace: media
  labels:
    app: torrent
spec:
  replicas: 1
  # Existing Gluetun/qBittorrent Pods commonly reserve a fixed hostPort. A
  # surge Pod cannot bind that port while the old Pod is still running.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: torrent
  template:
    metadata:
      labels:
        app: torrent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        # This placeholder represents the operator's existing, unchanged
        # qBittorrent container. Do not deploy the placeholder image.
        - name: qbittorrent
          image: replace-with-your-existing-qbittorrent-image
        - name: neotorrent
          image: ghcr.io/dotsml/neotorrent@sha256:REPLACE_WITH_PUBLISHED_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: QBITTORRENT_URL
              value: http://127.0.0.1:8080
            - name: LISTEN_PORT
              value: '8081'
            - name: MAX_UPLOAD_SIZE
              value: 100m
            - name: PROXY_CONNECT_TIMEOUT
              value: 10s
            - name: PROXY_READ_TIMEOUT
              value: 300s
            - name: PROXY_SEND_TIMEOUT
              value: 300s
            - name: PROXY_SSL_VERIFY
              value: 'on'
            - name: NEOTORRENT_MEDIA_MODE
              value: assist
            - name: NEOTORRENT_TV_ROOT
              value: /data/tv-shows
            - name: NEOTORRENT_MOVIES_ROOT
              value: /data/movies
            - name: NEOTORRENT_MEDIA_BROWSE_ROOT
              value: /data
            - name: NEOTORRENT_MEDIA_CONFIG_LOCKED
              value: 'true'
            - name: NEOTORRENT_TV_CATEGORY
              value: TV Shows
            - name: NEOTORRENT_MOVIE_CATEGORY
              value: Movies
          ports:
            - name: webui
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: webui
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: webui
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: webui
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: neotorrent-tmp
              mountPath: /tmp
      volumes:
        - name: neotorrent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
